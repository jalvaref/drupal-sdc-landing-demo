name: SDC handoff

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'validate, deploy_pantheon_dev or import_drupal_draft'
        required: true
        type: choice
        options: [validate, deploy_pantheon_dev, import_drupal_draft]
      run_id:
        description: 'ID de ejecución dentro de agent/runs'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.action == 'validate' || inputs.action == 'deploy_pantheon_dev' || inputs.action == 'import_drupal_draft' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar ejecución
        run: node agent/bin/validate-run.mjs agent/runs/${{ inputs.run_id }}
      - name: Validar paquete SDC si existe
        shell: bash
        run: |
          if [ -d "agent/runs/${{ inputs.run_id }}/sdc-package" ]; then
            node agent/bin/validate-sdc-package.mjs "agent/runs/${{ inputs.run_id }}/sdc-package"
          fi
      - name: Comprobar artefactos no vacíos
        shell: bash
        run: |
          run_dir="agent/runs/${{ inputs.run_id }}"
          test -s "$run_dir/proposal.json"
          test -s "$run_dir/preview/index.html"
          test -s "$run_dir/design/desktop.jpg"
          test -s "$run_dir/design/mobile.jpg"
          node -e "const p=require('./$run_dir/proposal.json'); if(p.status!=='sdc_approved') throw new Error('proposal no está sdc_approved'); if(p.run_id!=='${{ inputs.run_id }}') throw new Error('run_id no coincide');"

  pantheon:
    if: ${{ inputs.action == 'deploy_pantheon_dev' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar despliegue autorizado en Pantheon Dev
        env:
          PANTHEON_DEPLOY_COMMAND: ${{ secrets.PANTHEON_DEPLOY_COMMAND }}
          PANTHEON_GIT_REMOTE: ${{ secrets.PANTHEON_GIT_REMOTE }}
          PANTHEON_SSH_PRIVATE_KEY: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          if [ -z "$PANTHEON_DEPLOY_COMMAND" ]; then
            echo "::error::Falta el secreto PANTHEON_DEPLOY_COMMAND; no se ejecuta ningún despliegue.";
            exit 1;
          fi
          if [ -z "$PANTHEON_GIT_REMOTE" ] || [ -z "$PANTHEON_SSH_PRIVATE_KEY" ]; then
            echo "::error::Faltan PANTHEON_GIT_REMOTE o PANTHEON_SSH_PRIVATE_KEY.";
            exit 1;
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PANTHEON_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          host=$(printf '%s' "$PANTHEON_GIT_REMOTE" | sed -E 's#^[^@]+@([^:]+):.*#\1#')
          port=$(printf '%s' "$PANTHEON_GIT_REMOTE" | sed -nE 's#^[^@]+@[^:]+:([0-9]+)/.*#\1#p')
          if [ -z "$host" ] || [ -z "$port" ]; then
            echo "::error::PANTHEON_GIT_REMOTE no tiene el formato SSH esperado.";
            exit 1;
          fi
          ssh-keyscan -p "$port" "$host" >> "$HOME/.ssh/known_hosts"
          git remote remove pantheon 2>/dev/null || true
          git remote add pantheon "$PANTHEON_GIT_REMOTE"
          command="${PANTHEON_DEPLOY_COMMAND//<run>/$RUN_ID}"
          echo "Ejecutando el procedimiento autorizado de Pantheon Dev (run: $RUN_ID)."
          bash -lc "$command"
      - name: Comprobar Pantheon Dev después del despliegue
        env:
          PANTHEON_URL: https://dev-sdc-landing-demo.pantheonsite.io/
        run: |
          curl --fail --silent --show-error --max-time 30 "$PANTHEON_URL/pantheon_healthcheck"
          echo "Pantheon Dev responde después del procedimiento autorizado."

  drupal:
    if: ${{ inputs.action == 'import_drupal_draft' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar landing como draft mediante el procedimiento autorizado
        env:
          DRUPAL_IMPORT_COMMAND: ${{ secrets.DRUPAL_IMPORT_COMMAND }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          if [ -z "$DRUPAL_IMPORT_COMMAND" ]; then
            echo "::error::Falta el secreto DRUPAL_IMPORT_COMMAND; no se ejecuta ninguna importación.";
            exit 1;
          fi
          command="${DRUPAL_IMPORT_COMMAND//<run>/$RUN_ID}"
          echo "Ejecutando la importación Drupal del run $RUN_ID como draft."
          output=$(bash -lc "$command")
          echo "$output"
          if ! echo "$output" | grep -Eiq 'draft|no publicado|unpublished'; then
            echo "::error::La salida del procedimiento no confirma estado draft."
            exit 1
          fi
          if echo "$output" | grep -Eiq 'published|publicado[^a-z]'; then
            echo "::error::La salida indica publicación; se aborta por seguridad."
            exit 1
          fi
