services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
  drupal:
    image: drupal:11-apache
    depends_on: [db]
    ports: ["8080:80"]
    volumes:
      - ./:/opt/drupal
      - ./web:/var/www/html
    working_dir: /opt/drupal
volumes:
  db_data:
