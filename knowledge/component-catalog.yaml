schema_version: "1.0"
catalog:
  id: "sdc-landing-system"
  version: "2.2.0"
  language: "es"
  status: "prototype"
  purpose: "Base de conocimiento para seleccionar y componer landings SDC editables con Drupal Canvas."
  target_stack:
    cms: "Drupal"
    cms_version: "11"
    rendering: "Single Directory Components"
    visual_builder: "Drupal Canvas"
    theme: "sdc_landing"
  source_of_truth:
    theme_path: "web/themes/custom/sdc_landing"
    design_system: "web/themes/custom/sdc_landing/DESIGN-SYSTEM.md"
    visual_references: "docs/component-visuals"
  agent_contract:
    objective: "Generar una composición de landing usando preferentemente componentes y props existentes del catálogo."
    selection_rules:
      - "Priorizar siempre componentes del catálogo."
      - "Solo proponer un componente o variante nueva si la necesidad no puede cubrirse razonablemente con los elementos existentes."
      - "Antes de extender el catálogo, explicar la carencia y solicitar aprobación."
      - "Priorizar los campos existentes aunque no sean una coincidencia exacta, siempre que no se pierda información ni significado."
      - "Si un campo existente no es suficiente, proponer el nuevo campo antes de incorporarlo."
      - "Usar un único hero y un único h1 por landing."
      - "Mantener site-header y site-footer como elementos globales del tema."
      - "No inventar props, variantes, URLs ni componentes fuera de este catálogo."
    governance_rules:
      - "No inventar cifras, claims, testimonios, logos, partners ni condiciones comerciales como hechos."
      - "Los datos ficticios deben marcarse como ilustrativos o pending_validation."
      - "Drupal debe recibir la landing como draft; la publicación es manual."
      - "Las variantes se implementan como props enum, no como componentes duplicados."
  composition:
    recommended_order: ["C01", "C02", "C04", "C03", "C06", "C07", "C05", "C08", "C09", "C10"]
    required: ["C00", "C01", "C99"]
    canvas_rules:
      - "C00 and C99 are global theme elements and must not be duplicated inside Canvas page content unless a full page template explicitly requires them."
      - "Use only props declared in the component metadata files."
      - "Save imported Drupal pages as draft with status 0."
      - "After composition, verify that the components are visible in the Canvas library and that their props can be edited."
      - "Never persist the HTML inspector or its overlay in the Canvas tree or Drupal."
      - "Resolve prototype assets such as preview/hero-energy.jpg to a public theme asset or valid Drupal Media reference before import."
      - "After a Pantheon code sync, wait for the Integrated Composer build artifact and verify Drupal CLI readiness before importing."
  components:
    - { id: "C00", name: "SiteHeader", label: "Cabecera", slug: "site-header", include: "sdc_landing:site-header", path: "web/themes/custom/sdc_landing/components/site-header", category: "navigation", role: "foundation", variants: ["standard", "transparent", "dark"], props: ["brand_name", "brand_url", "navigation", "primary_cta", "variant"], constraints: ["Una vez por landing", "Global del tema", "Navegación accesible"] }
    - { id: "C01", name: "Hero", label: "Hero", slug: "hero", include: "sdc_landing:hero", path: "web/themes/custom/sdc_landing/components/hero", category: "conversion", role: "primary", variants: ["default", "split", "centered"], props: ["eyebrow", "title", "description", "image_src", "image_alt", "primary_label", "primary_url", "secondary_label", "secondary_url", "variant", "theme"], constraints: ["Una vez por landing", "title es el único h1", "No afirmar beneficios sin fuente", "image_src debe ser una ruta pública"] }
    - { id: "C02", name: "RichText", label: "Texto editorial", slug: "rich-text", include: "sdc_landing:rich-text", path: "web/themes/custom/sdc_landing/components/rich-text", category: "content", role: "supporting", variants: ["narrow", "medium", "wide"], props: ["eyebrow", "title", "body", "alignment", "width"], constraints: ["HTML filtrado", "Usar para contenido editorial"] }
    - { id: "C03", name: "ImageText", label: "Imagen y texto", slug: "image-text", include: "sdc_landing:image-text", path: "web/themes/custom/sdc_landing/components/image-text", category: "content", role: "supporting", variants: ["image-left", "image-right"], props: ["eyebrow", "title", "description", "image_src", "image_alt", "cta_label", "cta_url", "image_position", "theme"], constraints: ["Imagen con texto alternativo", "Un CTA como máximo", "image_src debe ser una ruta pública"] }
    - { id: "C04", name: "FeatureGrid", label: "Rejilla de capacidades", slug: "feature-grid", include: "sdc_landing:feature-grid", path: "web/themes/custom/sdc_landing/components/feature-grid", category: "content", role: "supporting", variants: ["standard", "with-icons", "with-numbers"], props: ["title", "description", "item_1_icon", "item_1_title", "item_1_text", "item_2_icon", "item_2_title", "item_2_text", "item_3_icon", "item_3_title", "item_3_text", "columns", "variant", "theme"], constraints: ["Tres items escalares en Canvas", "Estructura homogénea"] }
    - { id: "C05", name: "CardGrid", label: "Rejilla de tarjetas", slug: "card-grid", include: "sdc_landing:card-grid", path: "web/themes/custom/sdc_landing/components/card-grid", category: "content", role: "supporting", variants: ["three-columns", "two-columns", "featured-card", "horizontal"], props: ["title", "description", "cards", "variant"], constraints: ["Entre 2 y 6 tarjetas", "Cada tarjeta debe tener enlace"] }
    - { id: "C06", name: "Stats", label: "Estadísticas", slug: "stats", include: "sdc_landing:stats", path: "web/themes/custom/sdc_landing/components/stats", category: "evidence", role: "supporting", variants: ["horizontal", "grid", "highlighted"], props: ["title", "description", "stat_1_value", "stat_1_label", "stat_1_context", "stat_2_value", "stat_2_label", "stat_2_context", "stat_3_value", "stat_3_label", "stat_3_context", "stat_4_value", "stat_4_label", "stat_4_context", "variant"], constraints: ["Cuatro datos escalares en Canvas", "Cifras ficticias identificadas"] }
    - { id: "C07", name: "Steps", label: "Pasos", slug: "steps", include: "sdc_landing:steps", path: "web/themes/custom/sdc_landing/components/steps", category: "content", role: "supporting", variants: ["vertical", "horizontal", "numbered", "timeline"], props: ["title", "description", "step_1_title", "step_1_text", "step_1_icon", "step_2_title", "step_2_text", "step_2_icon", "step_3_title", "step_3_text", "step_3_icon", "step_4_title", "step_4_text", "step_4_icon", "variant"], constraints: ["Cuatro pasos escalares en Canvas", "Orden lógico"] }
    - { id: "C08", name: "Quote", label: "Cita", slug: "quote", include: "sdc_landing:quote", path: "web/themes/custom/sdc_landing/components/quote", category: "trust", role: "supporting", variants: ["standard", "highlighted", "with-image"], props: ["quote", "author", "role", "organization", "image", "source", "variant"], constraints: ["No atribuir citas reales sin autorización"] }
    - { id: "C09", name: "Accordion", label: "Acordeón", slug: "accordion", include: "sdc_landing:accordion", path: "web/themes/custom/sdc_landing/components/accordion", category: "content", role: "supporting", variants: ["faq", "standard", "bordered"], props: ["title", "question_1", "answer_1", "question_2", "answer_2", "question_3", "answer_3", "question_4", "answer_4", "default_open", "variant"], constraints: ["Cuatro preguntas escalares en Canvas", "Operable con teclado"] }
    - { id: "C10", name: "CtaBanner", label: "Banner CTA", slug: "cta-banner", include: "sdc_landing:cta-banner", path: "web/themes/custom/sdc_landing/components/cta-banner", category: "conversion", role: "supporting", variants: ["standard", "with-image"], props: ["eyebrow", "title", "description", "image", "primary_label", "primary_url", "secondary_label", "secondary_url", "theme", "variant"], constraints: ["Un CTA principal obligatorio", "Dos CTA como máximo"] }
    - { id: "C99", name: "SiteFooter", label: "Pie de página", slug: "site-footer", include: "sdc_landing:site-footer", path: "web/themes/custom/sdc_landing/components/site-footer", category: "navigation", role: "foundation", variants: ["standard", "compact", "multi-column"], props: ["logo", "columns", "legal_links", "social_links", "copyright"], constraints: ["Una vez por landing", "Último elemento global"] }
    - { id: "C11", name: "PlanComparison", label: "Comparativa de planes", slug: "plan-comparison", include: "sdc_landing:plan-comparison", path: "agent/runs/nexo-energia-20261112-visual/sdc-package/components/plan-comparison", category: "conversion", role: "candidate", status: "experimental", variants: ["experimental"], props: ["title", "description", "plans", "criteria", "selected_plan", "selection_label"], constraints: ["Tres planes", "Lectura tabular simultánea", "Selección y recomendación textual", "No estable"] }
    - { id: "C12", name: "RecommendationWizard", label: "Asistente de recomendación", slug: "recommendation-wizard", include: "sdc_landing:recommendation-wizard", path: "agent/runs/nexo-energia-20261112-visual/sdc-package/components/recommendation-wizard", category: "conversion", role: "candidate", status: "experimental", variants: ["experimental"], props: ["title", "description", "steps", "result_rules", "result_title", "result_body", "primary_label", "primary_url"], constraints: ["Tres pasos", "Validación y navegación", "Resultado condicionado", "No estable"] }
