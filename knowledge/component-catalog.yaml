schema_version: "1.0"
catalog:
  id: "sdc-landing-system"
  version: "2.0.0"
  language: "es"
  status: "prototype"
  purpose: "Base de conocimiento para seleccionar y componer landings SDC editables con Drupal Canvas."
  target_stack:
    cms: "Drupal"
    cms_version: "11"
    rendering: "Single Directory Components"
    visual_builder: "Drupal Canvas"
    theme: "sdc_landing"
  source_of_truth:
    theme_path: "web/themes/custom/sdc_landing"
    design_system: "web/themes/custom/sdc_landing/DESIGN-SYSTEM.md"
    visual_references: "docs/component-visuals"
  agent_contract:
    objective: "Generar una composición de landing usando preferentemente componentes y props existentes del catálogo."
    selection_rules:
      - "Priorizar siempre componentes del catálogo."
      - "Solo proponer un componente o variante nueva si la necesidad no puede cubrirse razonablemente con los elementos existentes."
      - "Antes de extender el catálogo, explicar la carencia y solicitar aprobación."
      - "Priorizar los campos existentes aunque no sean una coincidencia exacta, siempre que no se pierda información ni significado."
      - "Si un campo existente no es suficiente, proponer el nuevo campo antes de incorporarlo."
      - "Usar un único hero y un único h1 por landing."
      - "Mantener site-header y site-footer como elementos globales del tema."
      - "No inventar props, variantes, URLs ni componentes fuera de este catálogo."
    governance_rules:
      - "No inventar cifras, claims, testimonios, logos, partners ni condiciones comerciales como hechos."
      - "Los datos ficticios deben marcarse como ilustrativos o pending_validation."
      - "Drupal debe recibir la landing como draft; la publicación es manual."
      - "Las variantes se implementan como props enum, no como componentes duplicados."
  composition:
    recommended_order: ["C00", "C01", "C02", "C03", "C04", "C05", "C06", "C07", "C08", "C09", "C10", "C99"]
    required: ["C00", "C01", "C99"]
  components:
    - { id: "C00", name: "SiteHeader", label: "Cabecera", slug: "site-header", include: "sdc_landing:site-header", path: "web/themes/custom/sdc_landing/components/site-header", category: "navigation", role: "foundation", variants: ["standard", "transparent", "dark"], props: ["brand_name", "brand_url", "navigation", "primary_cta", "variant"], constraints: ["Una vez por landing", "Global del tema", "Navegación accesible"] }
    - { id: "C01", name: "Hero", label: "Hero", slug: "hero", include: "sdc_landing:hero", path: "web/themes/custom/sdc_landing/components/hero", category: "conversion", role: "primary", variants: ["default", "split", "centered"], props: ["eyebrow", "title", "description", "image", "primary_cta", "secondary_cta", "variant", "theme"], constraints: ["Una vez por landing", "title es el único h1", "No afirmar beneficios sin fuente"] }
    - { id: "C02", name: "RichText", label: "Texto editorial", slug: "rich-text", include: "sdc_landing:rich-text", path: "web/themes/custom/sdc_landing/components/rich-text", category: "content", role: "supporting", variants: ["narrow", "medium", "wide"], props: ["eyebrow", "title", "body", "alignment", "width"], constraints: ["HTML filtrado", "Usar para contenido editorial"] }
    - { id: "C03", name: "ImageText", label: "Imagen y texto", slug: "image-text", include: "sdc_landing:image-text", path: "web/themes/custom/sdc_landing/components/image-text", category: "content", role: "supporting", variants: ["image-left", "image-right"], props: ["eyebrow", "title", "description", "image", "cta", "image_position", "theme"], constraints: ["Imagen con texto alternativo", "Un CTA como máximo"] }
    - { id: "C04", name: "FeatureGrid", label: "Rejilla de capacidades", slug: "feature-grid", include: "sdc_landing:feature-grid", path: "web/themes/custom/sdc_landing/components/feature-grid", category: "content", role: "supporting", variants: ["standard", "with-icons", "with-numbers"], props: ["title", "description", "items", "columns", "variant", "theme"], constraints: ["Entre 3 y 6 items", "Estructura homogénea"] }
    - { id: "C05", name: "CardGrid", label: "Rejilla de tarjetas", slug: "card-grid", include: "sdc_landing:card-grid", path: "web/themes/custom/sdc_landing/components/card-grid", category: "content", role: "supporting", variants: ["three-columns", "two-columns", "featured-card", "horizontal"], props: ["title", "description", "cards", "variant"], constraints: ["Entre 2 y 6 tarjetas", "Cada tarjeta debe tener enlace"] }
    - { id: "C06", name: "Stats", label: "Estadísticas", slug: "stats", include: "sdc_landing:stats", path: "web/themes/custom/sdc_landing/components/stats", category: "evidence", role: "supporting", variants: ["horizontal", "grid", "highlighted"], props: ["title", "description", "items", "variant"], constraints: ["Entre 2 y 4 datos", "Cifras ficticias identificadas"] }
    - { id: "C07", name: "Steps", label: "Pasos", slug: "steps", include: "sdc_landing:steps", path: "web/themes/custom/sdc_landing/components/steps", category: "content", role: "supporting", variants: ["vertical", "horizontal", "numbered", "timeline"], props: ["title", "description", "items", "variant"], constraints: ["Entre 3 y 6 pasos", "Orden lógico"] }
    - { id: "C08", name: "Quote", label: "Cita", slug: "quote", include: "sdc_landing:quote", path: "web/themes/custom/sdc_landing/components/quote", category: "trust", role: "supporting", variants: ["standard", "highlighted", "with-image"], props: ["quote", "author", "role", "organization", "image", "source", "variant"], constraints: ["No atribuir citas reales sin autorización"] }
    - { id: "C09", name: "Accordion", label: "Acordeón", slug: "accordion", include: "sdc_landing:accordion", path: "web/themes/custom/sdc_landing/components/accordion", category: "content", role: "supporting", variants: ["faq", "standard", "bordered"], props: ["title", "items", "default_open", "variant"], constraints: ["Entre 2 y 8 items", "Operable con teclado"] }
    - { id: "C10", name: "CtaBanner", label: "Banner CTA", slug: "cta-banner", include: "sdc_landing:cta-banner", path: "web/themes/custom/sdc_landing/components/cta-banner", category: "conversion", role: "supporting", variants: ["standard", "with-image"], props: ["eyebrow", "title", "description", "image", "primary_cta", "secondary_cta", "theme", "variant"], constraints: ["Un CTA principal obligatorio", "Dos CTA como máximo"] }
    - { id: "C99", name: "SiteFooter", label: "Pie de página", slug: "site-footer", include: "sdc_landing:site-footer", path: "web/themes/custom/sdc_landing/components/site-footer", category: "navigation", role: "foundation", variants: ["standard", "compact", "multi-column"], props: ["logo", "columns", "legal_links", "social_links", "copyright"], constraints: ["Una vez por landing", "Último elemento global"] }
