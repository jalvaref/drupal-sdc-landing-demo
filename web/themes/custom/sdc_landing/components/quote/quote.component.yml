$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Quote
status: stable
props:
  type: object
  required: [quote]
  properties:
    quote: { type: string, title: 'Cita', minLength: 1, examples: ['La confianza se diseña desde el principio.'] }
    author: { type: string, title: 'Autor', examples: ['María García'] }
    role: { type: string, title: 'Cargo', examples: ['Directora de Innovación'] }
    organization: { type: string, title: 'Organización' }
    image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image' }
    source: { type: string, title: 'Fuente' }
    variant: { type: string, title: 'Variante', enum: [standard, highlighted, with-image], default: highlighted, examples: ['highlighted'] }
