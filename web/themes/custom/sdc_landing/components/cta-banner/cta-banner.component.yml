$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: CTA banner
status: stable
props:
  type: object
  required: [title, primary_cta]
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', minLength: 1, examples: ['Construyamos una IA preparada para el futuro'] }
    description: { type: string, title: 'Descripción' }
    image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image' }
    primary_cta: { type: object, title: 'CTA principal', required: [label, url], examples: [{ label: 'Hablemos', url: '#contacto' }], properties: { label: { type: string, title: 'Texto', examples: ['Hablemos'] }, url: { type: string, title: 'URL', format: uri-reference, examples: ['#contacto'] } } }
    secondary_cta: { type: object, title: 'CTA secundaria', properties: { label: { type: string, title: 'Texto' }, url: { type: string, title: 'URL', format: uri-reference } } }
    theme: { type: string, title: 'Tema', enum: [light, dark, brand], default: dark, examples: ['dark'] }
    variant: { type: string, title: 'Variante', enum: [standard, with-image], default: standard, examples: ['standard'] }
