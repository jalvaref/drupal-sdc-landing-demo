$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: CTA banner
status: stable
props:
  type: object
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', examples: ['Construyamos una IA preparada para el futuro'] }
    description: { type: string, title: 'Descripción' }
    image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image' }
    primary_label: { type: string, title: 'Texto CTA principal', examples: ['Hablemos'] }
    primary_url: { type: string, title: 'URL CTA principal', format: uri-reference, examples: ['#contacto'] }
    secondary_label: { type: string, title: 'Texto CTA secundaria' }
    secondary_url: { type: string, title: 'URL CTA secundaria', format: uri-reference, examples: ['#enfoque'] }
    theme: { type: string, title: 'Tema', enum: [light, dark, brand], default: dark, examples: ['dark'] }
    variant: { type: string, title: 'Variante', enum: [standard, with-image], default: standard, examples: ['standard'] }
