$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Steps
status: stable
props:
  type: object
  properties:
    title: { type: string, title: 'Título', examples: ['Un recorrido claro de principio a fin'] }
    description: { type: string, title: 'Descripción' }
    step_1_title: { type: string, title: 'Título paso 1', examples: ['Diagnóstico'] }
    step_1_text: { type: string, title: 'Texto paso 1', examples: ['Analizamos tu situación actual.'] }
    step_1_icon: { type: string, title: 'Icono paso 1', examples: ['diagnosis'] }
    step_2_title: { type: string, title: 'Título paso 2', examples: ['Diseño'] }
    step_2_text: { type: string, title: 'Texto paso 2', examples: ['Definimos la solución adecuada.'] }
    step_2_icon: { type: string, title: 'Icono paso 2', examples: ['design'] }
    step_3_title: { type: string, title: 'Título paso 3', examples: ['Implementación'] }
    step_3_text: { type: string, title: 'Texto paso 3', examples: ['Ponemos la solución en marcha.'] }
    step_3_icon: { type: string, title: 'Icono paso 3', examples: ['implementation'] }
    step_4_title: { type: string, title: 'Título paso 4', examples: ['Escalado'] }
    step_4_text: { type: string, title: 'Texto paso 4', examples: ['Impulsamos la mejora continua.'] }
    step_4_icon: { type: string, title: 'Icono paso 4', examples: ['scale'] }
    variant: { type: string, title: 'Variante', enum: [vertical, horizontal, numbered, timeline], default: numbered, examples: ['numbered'] }
