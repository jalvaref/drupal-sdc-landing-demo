$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Steps
status: stable
props:
  type: object
  required: [items]
  properties:
    title: { type: string, title: 'Título', examples: ['Un recorrido claro de principio a fin'] }
    description: { type: string, title: 'Descripción' }
    items: { type: array, title: 'Pasos', minItems: 3, maxItems: 6, examples: [[{ title: 'Diagnóstico', text: 'Analizamos tu situación actual.', icon: 'diagnosis' }, { title: 'Diseño', text: 'Definimos la solución adecuada.', icon: 'design' }, { title: 'Implementación', text: 'Ponemos la solución en marcha.', icon: 'implementation' }]], items: { type: object, required: [title, text], properties: { title: { type: string, title: 'Título', examples: ['Diagnóstico'] }, text: { type: string, title: 'Texto', examples: ['Analizamos tu situación actual.'] }, icon: { type: string, title: 'Icono', examples: ['diagnosis'] } } } }
    variant: { type: string, title: 'Variante', enum: [vertical, horizontal, numbered, timeline], default: numbered, examples: ['numbered'] }
