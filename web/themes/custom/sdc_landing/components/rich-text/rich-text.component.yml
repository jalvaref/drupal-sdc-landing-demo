$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Rich text
status: stable
props:
  type: object
  required: [body]
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', examples: ['Una estrategia de IA necesita una base común'] }
    body: { type: string, title: 'Contenido', minLength: 1, contentMediaType: text/html, x-formatting-context: block, examples: ['<p>Contenido editorial de ejemplo.</p>'] }
    alignment: { type: string, title: 'Alineación', enum: [left, center], default: left, examples: ['left'] }
    width: { type: string, title: 'Anchura', enum: [narrow, medium, wide], default: medium, examples: ['medium'] }
