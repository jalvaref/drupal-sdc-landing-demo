$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Image and text
status: stable
props:
  type: object
  required: [title]
  properties:
    eyebrow: { type: string }
    title: { type: string, minLength: 1, examples: ['Diseñar con control desde el principio'] }
    description: { type: string }
    image: { type: object, $ref: 'json-schema-definitions://canvas.module/image', examples: [{ src: '/themes/custom/sdc_landing/images/control-room.jpg', alt: 'Centro de control energético' }] }
    cta: { type: object, properties: { label: { type: string }, url: { type: string } } }
    image_position: { type: string, enum: [left, right], default: left }
    theme: { type: string, enum: [light, dark, brand], default: light }
