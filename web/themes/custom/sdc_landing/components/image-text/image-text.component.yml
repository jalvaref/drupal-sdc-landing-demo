$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Image and text
status: stable
props:
  type: object
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', examples: ['Diseñar con control desde el principio'] }
    description: { type: string, title: 'Descripción' }
    image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image', examples: [{ src: '/themes/custom/sdc_landing/images/control-room.jpg', alt: 'Centro de control energético' }] }
    cta_label: { type: string, title: 'Texto CTA', examples: ['Conocer más'] }
    cta_url: { type: string, title: 'URL CTA', format: uri-reference, examples: ['#contacto'] }
    image_position: { type: string, title: 'Posición de la imagen', enum: [left, right], default: left, examples: ['left'] }
    theme: { type: string, title: 'Tema', enum: [light, dark, brand], default: light, examples: ['light'] }
