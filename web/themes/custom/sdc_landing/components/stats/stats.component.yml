$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Statistics
status: stable
props:
  type: object
  required: [items]
  properties:
    title: { type: string, title: 'Título', examples: ['Datos destacados'] }
    description: { type: string, title: 'Descripción' }
    items: { type: array, title: 'Estadísticas', minItems: 2, maxItems: 4, examples: [[{ value: '40%', label: 'Mayor eficiencia operativa' }, { value: '3x', label: 'Más velocidad de entrega' }]], items: { type: object, required: [value, label], properties: { value: { type: string, title: 'Valor', examples: ['40%'] }, label: { type: string, title: 'Etiqueta', examples: ['Mayor eficiencia operativa'] }, context: { type: string, title: 'Contexto' } } } }
    variant: { type: string, title: 'Variante', enum: [horizontal, grid, highlighted], default: highlighted, examples: ['highlighted'] }
