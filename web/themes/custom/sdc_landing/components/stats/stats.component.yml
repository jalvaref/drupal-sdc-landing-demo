$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Statistics
status: stable
props:
  type: object
  properties:
    title: { type: string, title: 'Título', examples: ['Datos destacados'] }
    description: { type: string, title: 'Descripción' }
    stat_1_value: { type: string, title: 'Valor 1', examples: ['40%'] }
    stat_1_label: { type: string, title: 'Etiqueta 1', examples: ['Mayor eficiencia operativa'] }
    stat_1_context: { type: string, title: 'Contexto 1' }
    stat_2_value: { type: string, title: 'Valor 2', examples: ['3x'] }
    stat_2_label: { type: string, title: 'Etiqueta 2', examples: ['Más velocidad de entrega'] }
    stat_2_context: { type: string, title: 'Contexto 2' }
    stat_3_value: { type: string, title: 'Valor 3' }
    stat_3_label: { type: string, title: 'Etiqueta 3' }
    stat_3_context: { type: string, title: 'Contexto 3' }
    stat_4_value: { type: string, title: 'Valor 4', examples: ['85%'] }
    stat_4_label: { type: string, title: 'Etiqueta 4', examples: ['Satisfacción de clientes'] }
    stat_4_context: { type: string, title: 'Contexto 4' }
    variant: { type: string, title: 'Variante', enum: [horizontal, grid, highlighted], default: highlighted, examples: ['highlighted'] }
