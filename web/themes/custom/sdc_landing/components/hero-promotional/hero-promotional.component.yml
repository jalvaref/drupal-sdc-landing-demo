$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Hero promotional
status: stable
props:
  type: object
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', examples: ['Una solución preparada para crecer'] }
    description: { type: string, title: 'Descripción' }
    benefits: { type: array, title: 'Beneficios', items: { type: string, title: 'Beneficio' } }
    primary_label: { type: string, title: 'CTA principal', examples: ['Conoce la propuesta'] }
    primary_url: { type: string, title: 'URL principal', format: uri-reference, default: '#offers-title', examples: ['#offers-title'] }
    secondary_label: { type: string, title: 'CTA secundaria' }
    secondary_url: { type: string, title: 'URL secundaria', format: uri-reference, default: '#faq-title', examples: ['#faq-title'] }
    visual_label: { type: string, title: 'Etiqueta visual' }
