$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Offer card
status: stable
props:
  type: object
  properties:
    title: { type: string, title: 'Título', examples: ['Plan de adopción'] }
    description: { type: string, title: 'Descripción' }
    price: { type: string, title: 'Precio' }
    price_note: { type: string, title: 'Nota de precio' }
    cta_label: { type: string, title: 'Texto CTA' }
    cta_url: { type: string, title: CTA URL, format: uri-reference, default: '#faq-title', examples: ['#faq-title'] }
    badge: { type: string, title: 'Etiqueta' }
