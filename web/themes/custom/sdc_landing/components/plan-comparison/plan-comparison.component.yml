    plan_1_action_label: { type: string, title: 'Acción plan 1', examples: ['Ver Base'] }
    plan_1_action_url: { type: string, title: 'URL plan 1', format: uri-reference, examples: ['#contacto'] }
    plan_2_id: { type: string, title: 'ID plan 2', examples: ['equilibrio'] }
