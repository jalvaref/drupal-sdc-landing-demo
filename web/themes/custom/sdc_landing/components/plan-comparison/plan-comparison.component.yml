$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Plan comparison
status: experimental
props:
  type: object
  required: [title, plans, criteria]
  properties:
    title: { type: string, title: 'Título', examples: ['Compara las alternativas'] }
    description: { type: string, title: 'Descripción', examples: ['Precios y condiciones ilustrativos para esta demostración.'] }
    plans:
      type: array
      title: 'Planes'
      minItems: 3
      maxItems: 3
      items:
        type: object
        required: [id, name, price, price_note, recommended, action_label, action_url]
        properties:
          id: { type: string, title: 'ID del plan' }
          name: { type: string, title: 'Nombre' }
          price: { type: string, title: 'Precio' }
          price_note: { type: string, title: 'Nota de precio' }
          recommended: { type: boolean, title: 'Recomendado' }
          highlight: { type: string, title: 'Destacado' }
          action_label: { type: string, title: 'Texto de acción' }
          action_url: { type: string, title: 'URL de acción', format: uri-reference }
      examples:
        - id: base
          name: Base hogar
          price: '29,90 €'
          price_note: 'al mes · orientativo'
          recommended: false
          highlight: Para empezar
          action_label: Ver Base
          action_url: '#contacto'
        - id: equilibrio
          name: Equilibrio
          price: '39,90 €'
          price_note: 'al mes · orientativo'
          recommended: true
          highlight: Orientación demostrativa
          action_label: Elegir Equilibrio
          action_url: '#recomendacion'
        - id: flex
          name: Flex movilidad
          price: '49,90 €'
          price_note: 'al mes · orientativo'
          recommended: false
          highlight: Más flexibilidad
          action_label: Ver Flex
          action_url: '#contacto'
    criteria:
      type: array
      title: 'Criterios'
      minItems: 1
      items:
        type: object
        required: [id, label, values]
        properties:
          id: { type: string, title: 'ID del criterio' }
          label: { type: string, title: 'Etiqueta' }
          values: { type: array, title: 'Valores por plan', minItems: 3, maxItems: 3, items: { type: string } }
      examples:
        - id: home
          label: Tipo de hogar
          values: [Cualquier vivienda, Vivienda habitual, Vivienda + segunda plaza]
    selected_plan: { type: string, title: 'Plan seleccionado', examples: ['equilibrio'] }
    selection_label: { type: string, title: 'Texto de selección', examples: ['Selecciona una opción para continuar'] }
