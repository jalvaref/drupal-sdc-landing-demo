$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Site footer
status: stable
props:
  type: object
  required: [columns, legal_links]
  properties:
    logo: { type: object, title: Logo, properties: { label: { type: string, title: Label }, url: { type: string, title: URL, format: uri-reference } } }
    columns:
      title: Columnas
      type: array
      minItems: 1
      maxItems: 4
      examples: [[{ title: 'Soluciones', links: [{ label: 'Tecnología', url: '#' }] }]]
      items:
        type: object
        required: [title, links]
        properties:
          title: { type: string, examples: ['Soluciones'] }
          links: { type: array, minItems: 1, examples: [[{ label: 'Tecnología', url: '#' }]], items: { type: object, required: [label, url], properties: { label: { type: string, examples: ['Tecnología'] }, url: { type: string, format: uri-reference, examples: ['#'] } } } }
    legal_links: { type: array, title: 'Enlaces legales', minItems: 1, examples: [[{ label: 'Privacidad', url: '#' }]], items: { type: object, required: [label, url], properties: { label: { type: string, examples: ['Privacidad'] }, url: { type: string, format: uri-reference, examples: ['#'] } } } }
    social_links: { type: array, title: 'Redes sociales', items: { type: object, required: [label, url], properties: { label: { type: string }, url: { type: string } } } }
    copyright: { type: string, title: Copyright, examples: ['© 2026 SDC Demo'] }
