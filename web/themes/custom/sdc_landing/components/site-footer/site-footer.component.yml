$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Site footer
status: stable
props:
  type: object
  required: [columns, legal_links]
  properties:
    logo: { type: object, properties: { label: { type: string }, url: { type: string } } }
    columns:
      type: array
      minItems: 1
      maxItems: 4
      items:
        type: object
        required: [title, links]
        properties:
          title: { type: string }
          links: { type: array, minItems: 1, items: { type: object, required: [label, url], properties: { label: { type: string }, url: { type: string } } } }
    legal_links: { type: array, minItems: 1, items: { type: object, required: [label, url], properties: { label: { type: string }, url: { type: string } } } }
    social_links: { type: array, items: { type: object, required: [label, url], properties: { label: { type: string }, url: { type: string } } } }
    copyright: { type: string }
