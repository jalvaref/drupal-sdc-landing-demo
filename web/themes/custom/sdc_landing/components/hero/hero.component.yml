$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Hero
status: stable
props:
  type: object
  properties:
    eyebrow: { type: string, title: 'Antetítulo' }
    title: { type: string, title: 'Título', examples: ['Convierte la IA en una capacidad empresarial'] }
    description: { type: string, title: 'Descripción' }
    image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image', examples: [{ src: '/themes/custom/sdc_landing/images/hero-energy.jpg', alt: 'Paisaje energético' }] }
    primary_label: { type: string, title: 'Texto CTA principal', examples: ['Solicitar una conversación'] }
    primary_url: { type: string, title: 'URL CTA principal', format: uri-reference, examples: ['#contacto'] }
    secondary_label: { type: string, title: 'Texto CTA secundaria', examples: ['Explorar el enfoque'] }
    secondary_url: { type: string, title: 'URL CTA secundaria', format: uri-reference, examples: ['#enfoque'] }
    variant: { type: string, title: 'Variante', enum: [default, split, centered], default: split, examples: ['split'] }
    theme: { type: string, title: 'Tema', enum: [light, dark, brand], default: light, examples: ['light'] }
