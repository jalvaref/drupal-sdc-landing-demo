$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Site header
status: stable
props:
  type: object
  properties:
    brand_name: { type: string, title: Brand name }
    brand_url: { type: string, title: Brand URL, default: '/' }
    utility_label: { type: string, title: Utility link label }
    utility_url: { type: string, title: Utility link URL, default: '#offers-title' }
    phone_label: { type: string, title: Phone label }
    phone_url: { type: string, title: Phone URL, default: 'tel:900000000' }
