$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Card grid
status: stable
props:
  type: object
  required: [cards]
  properties:
    title: { type: string, title: 'Título', examples: ['Explora nuestras soluciones'] }
    description: { type: string, title: 'Descripción' }
    cards: { type: array, title: 'Tarjetas', minItems: 2, maxItems: 6, examples: [[{ eyebrow: 'Planificación', title: 'Estrategia', text: 'Convierte tus objetivos en planes de alto impacto.', link: { label: 'Ver solución', url: '#contacto' } }, { eyebrow: 'Gestión', title: 'Control', text: 'Toma mejores decisiones con información confiable.', link: { label: 'Ver solución', url: '#contacto' } }]], items: { type: object, required: [title, link], properties: { image: { type: object, title: 'Imagen', $ref: 'json-schema-definitions://canvas.module/image' }, eyebrow: { type: string, title: 'Antetítulo', examples: ['Planificación'] }, title: { type: string, title: 'Título', examples: ['Estrategia'] }, text: { type: string, title: 'Texto', examples: ['Convierte tus objetivos en planes de alto impacto.'] }, tag: { type: string, title: 'Etiqueta' }, link: { type: object, title: 'Enlace', required: [label, url], examples: [{ label: 'Ver solución', url: '#contacto' }], properties: { label: { type: string, title: 'Texto del enlace', examples: ['Ver solución'] }, url: { type: string, title: 'URL', format: uri-reference, examples: ['#contacto'] } } } } } }
    variant: { type: string, title: 'Variante', enum: [three-columns, two-columns, featured-card, horizontal], default: three-columns, examples: ['three-columns'] }
