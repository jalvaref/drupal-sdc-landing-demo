$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Card grid
status: stable
props:
  type: object
  required: [cards]
  properties:
    title: { type: string }
    description: { type: string }
    cards: { type: array, minItems: 2, maxItems: 6, examples: [[{ eyebrow: 'Planificación', title: 'Estrategia', text: 'Convierte tus objetivos en planes de alto impacto.', link: { label: 'Ver solución', url: '#contacto' } }, { eyebrow: 'Gestión', title: 'Control', text: 'Toma mejores decisiones con información confiable.', link: { label: 'Ver solución', url: '#contacto' } }]], items: { type: object, required: [title, link], properties: { image: { type: object, $ref: 'json-schema-definitions://canvas.module/image' }, eyebrow: { type: string, examples: ['Planificación'] }, title: { type: string, examples: ['Estrategia'] }, text: { type: string, examples: ['Convierte tus objetivos en planes de alto impacto.'] }, tag: { type: string }, link: { type: object, required: [label, url], examples: [{ label: 'Ver solución', url: '#contacto' }], properties: { label: { type: string, examples: ['Ver solución'] }, url: { type: string, format: uri-reference, examples: ['#contacto'] } } } } } }
    variant: { type: string, enum: [three-columns, two-columns, featured-card, horizontal], default: three-columns }
