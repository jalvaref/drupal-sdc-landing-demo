$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Recommendation wizard
status: experimental
props:
  type: object
  required: [title, steps, result_rules, result_title, result_body, primary_label, primary_url]
  properties:
    title: { type: string, title: 'Título', examples: ['Encuentra una orientación demostrativa'] }
    description: { type: string, title: 'Descripción', examples: ['Responde tres preguntas ficticias para explorar una orientación.'] }
    steps:
      type: array
      title: 'Pasos'
      minItems: 3
      maxItems: 3
      items:
        type: object
        required: [id, label, field, type, options, required]
        properties:
          id: { type: string, title: 'ID del paso' }
          label: { type: string, title: 'Etiqueta' }
          field: { type: string, title: 'Campo' }
          type: { type: string, title: 'Tipo', enum: [radio, select] }
          options: { type: array, title: 'Opciones', items: { type: string } }
          required: { type: boolean, title: 'Obligatorio' }
      examples:
        -
          - id: home
            label: Tu vivienda
            field: home_type
            type: radio
            options: [Piso, Casa, Otra vivienda]
            required: true
          - id: charge
            label: Tu recarga
            field: charge_pattern
            type: radio
            options: [Ocasional, Casi siempre en casa, Todavía no lo sé]
            required: true
          - id: zone
            label: Tu zona
            field: zone
            type: select
            options: [Urbana, Metropolitana, Rural]
            required: true
    result_rules:
      type: array
      title: 'Reglas de resultado'
      minItems: 1
      items:
        type: object
        required: [when, plan_id]
        properties:
          when: { type: string, title: 'Condición' }
          plan_id: { type: string, title: 'Plan resultante' }
      examples:
        -
          - when: 'otherwise'
            plan_id: flex
    result_title: { type: string, title: 'Título del resultado', examples: ['Tu orientación ficticia: Equilibrio'] }
    result_body: { type: string, title: 'Texto del resultado', examples: ['Esta alternativa podría ser un punto de partida para conversar.'] }
    primary_label: { type: string, title: 'CTA principal', examples: ['Quiero hablar sobre mi orientación'] }
    primary_url: { type: string, title: 'URL CTA principal', format: uri-reference, examples: ['#contacto'] }
