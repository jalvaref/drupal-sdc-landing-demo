schema_version: "1.0"
page:
  id: "nexo-energia-movilidad"
  title: "Nexo Energía · Energía que se adapta a cómo te mueves"
  status: "draft"
  drupal_status: 0
  canvas_only: false
  notes:
    - "C00 site-header y C99 site-footer son globales del tema y no forman parte del árbol Canvas."
    - "C11 y C12 son experimentales y bloquean la importación hasta que sus contratos se validen y el runtime los soporte."
  components:
    - id: "hero-01"
      component_id: "C01"
      include: "sdc_landing:hero"
      variant: "split"
      status: "catalog"
      props:
        eyebrow: "Nexo Energía · concepto demostrativo"
        title: "Una energía que se adapta a cómo te mueves"
        description: "Coordina el consumo de tu hogar con las necesidades de recarga de tu vehículo eléctrico, con una propuesta clara y fácil de comparar."
        image_src: "assets/nexo-energia-hero.jpg"
        image_alt: "Vivienda iluminada al anochecer con un vehículo eléctrico conectado y una persona llegando a casa"
        primary_label: "Quiero hablar con Nexo"
        primary_url: "#contacto"
        secondary_label: "Comparar alternativas"
        secondary_url: "#comparativa"
        variant: "split"
        theme: "light"
    - id: "intro-01"
      component_id: "C02"
      include: "sdc_landing:rich-text"
      variant: "medium"
      status: "catalog"
      props:
        eyebrow: "Una propuesta sencilla"
        title: "La energía de tu casa también puede acompañar tus trayectos"
        body: "<p>Nexo Energía es un concepto ficticio para explorar cómo una tarifa doméstica, la recarga y una recomendación clara podrían convivir en una misma experiencia.</p>"
        alignment: "center"
        width: "medium"
    - id: "benefits-01"
      component_id: "C04"
      include: "sdc_landing:feature-grid"
      variant: "with-icons"
      status: "catalog"
      props:
        title: "Lo esencial, de un vistazo"
        description: "Tres ventajas ilustrativas para entender la propuesta antes de comparar."
        item_1_icon: "home"
        item_1_title: "Pensada para tu hogar"
        item_1_text: "Una lectura sencilla del consumo doméstico y la recarga."
        item_2_icon: "compare"
        item_2_title: "Fácil de comparar"
        item_2_text: "Criterios visibles para valorar tres alternativas ficticias."
        item_3_icon: "conversation"
        item_3_title: "Acompañamiento"
        item_3_text: "Una orientación demostrativa antes de hablar con el equipo."
        columns: 3
        variant: "with-icons"
        theme: "light"
    - id: "stats-01"
      component_id: "C06"
      include: "sdc_landing:stats"
      variant: "highlighted"
      status: "catalog"
      props:
        title: "Una orientación para empezar"
        description: "Cifras de demostración, no métricas comerciales reales."
        stat_1_value: "3"
        stat_1_label: "alternativas ficticias"
        stat_1_context: "Comparación en una misma vista"
        stat_2_value: "3"
        stat_2_label: "preguntas para orientarte"
        stat_2_context: "Recorrido demostrativo"
        stat_3_value: "1"
        stat_3_label: "conversación siguiente"
        stat_3_context: "CTA principal de la landing"
        variant: "highlighted"
    - id: "comparison-01"
      component_id: "C11"
      include: "sdc_landing:plan-comparison"
      variant: "experimental"
      status: "experimental"
      props_ref: "candidate-components.yaml#/components/C11/props"
      blocked_until: "sdc_approved_and_experimental_runtime_available"
    - id: "wizard-01"
      component_id: "C12"
      include: "sdc_landing:recommendation-wizard"
      variant: "experimental"
      status: "experimental"
      props_ref: "candidate-components.yaml#/components/C12/props"
      blocked_until: "sdc_approved_and_experimental_runtime_available"
    - id: "editorial-01"
      component_id: "C03"
      include: "sdc_landing:image-text"
      variant: "image-right"
      status: "catalog"
      props:
        eyebrow: "Una escena cotidiana"
        title: "Cuando llegar a casa también significa estar listo para mañana"
        description: "La vivienda, la movilidad y la tranquilidad de tener la propuesta explicada con claridad."
        image_src: "assets/nexo-energia-hero.jpg"
        image_alt: "Persona llegando a una vivienda iluminada junto a un vehículo eléctrico conectado"
        cta_label: "Volver a comparar"
        cta_url: "#comparativa"
        image_position: "right"
        theme: "light"
    - id: "process-01"
      component_id: "C07"
      include: "sdc_landing:steps"
      variant: "numbered"
      status: "catalog"
      props:
        title: "Un proceso fácil de seguir"
        description: "Tres pasos ilustrativos para explicar el siguiente tramo de la conversación."
        step_1_title: "Cuéntanos tu situación"
        step_1_text: "Compartes tus necesidades de hogar y movilidad en una conversación de demostración."
        step_1_icon: "conversation"
        step_2_title: "Revisamos las opciones"
        step_2_text: "Repasamos condiciones y dudas con lenguaje claro."
        step_2_icon: "compare"
        step_3_title: "Decides con contexto"
        step_3_text: "Te llevas una orientación para valorar el siguiente paso."
        step_3_icon: "decision"
        variant: "numbered"
    - id: "faq-01"
      component_id: "C09"
      include: "sdc_landing:accordion"
      variant: "faq"
      status: "catalog"
      props:
        title: "Preguntas frecuentes"
        question_1: "¿Quién puede usar esta orientación?"
        answer_1: "<p>Cualquier persona adulta que quiera explorar la relación entre su hogar y la movilidad eléctrica. Es una experiencia ficticia y no determina una elegibilidad real.</p>"
        question_2: "¿Los precios y condiciones son reales?"
        answer_2: "<p>No. Los precios, ventajas y condiciones mostrados son ilustrativos y están pendientes de validación; no constituyen una oferta publicada.</p>"
        question_3: "¿Necesito tener ya un vehículo eléctrico?"
        answer_3: "<p>No se presupone. La propuesta está pensada también para quien está considerando adquirirlo y quiere entender sus opciones.</p>"
        question_4: "¿Qué ocurre al solicitar una conversación?"
        answer_4: "<p>En este prototipo se mostraría un siguiente paso de contacto. No se envían datos ni se conecta con sistemas reales.</p>"
        default_open: 0
        variant: "faq"
    - id: "cta-01"
      component_id: "C10"
      include: "sdc_landing:cta-banner"
      variant: "standard"
      status: "catalog"
      props:
        eyebrow: "Siguiente paso"
        title: "¿Hablamos de cómo te mueves?"
        description: "Solicita una conversación de demostración o vuelve a revisar las alternativas antes de decidir."
        primary_label: "Quiero hablar con Nexo"
        primary_url: "#contacto"
        secondary_label: "Volver a la comparativa"
        secondary_url: "#comparativa"
        theme: "dark"
        variant: "standard"
