        criterion_3_value_1: "Guía inicial demostrativa"
        criterion_3_value_2: "Visión conjunta ilustrativa"
        criterion_3_value_3: "Opciones flexibles ilustrativas"
        criterion_4_label: "Condición principal"
        criterion_4_value_1: "Sin condición comercial real"
