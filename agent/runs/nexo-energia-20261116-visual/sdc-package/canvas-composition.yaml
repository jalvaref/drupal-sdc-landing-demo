schema_version: "1.0"
page:
  id: "nexo-energia-hogar-movilidad"
  title: "Nexo Energía · Hogar y movilidad"
  status: "draft"
  drupal_status: 0
  deployment_classification: "code_deploy_required"
  notes:
    - "C00 site-header y C99 site-footer son globales del tema y no forman parte del árbol Canvas."
    - "El inspector del prototipo HTML no se incluye en esta composición."
    - "C11 y C12 son experimentales; el paquete requiere despliegue de código antes de importar el draft."
    - "Todo el contenido, precios, condiciones, resultados y activos son ilustrativos y no válidos para publicación."
  components:
    - id: "hero-01"
      component_id: "C01"
      include: "sdc_landing:hero"
      status: "catalog"
      props:
        eyebrow: "Concepto de demostración"
        title: "La energía de tu hogar también puede acompañar tus trayectos"
        description: "Explora, de forma demostrativa, cómo se conectan el consumo de tu vivienda y la movilidad eléctrica."
        image_src: "/themes/custom/sdc_landing/images/nexo-energia-20261116-hero.jpg"
        image_alt: "Persona llegando a casa junto a un vehículo eléctrico conectado a un cargador doméstico"
        primary_label: "Explorar mi orientación"
        primary_url: "#orientacion"
        secondary_label: "Comparar alternativas"
        secondary_url: "#alternativas"
        variant: "split"
        theme: "light"
    - id: "intro-01"
      component_id: "C02"
      include: "sdc_landing:rich-text"
      status: "catalog"
      props:
        eyebrow: "Hogar, consumo y movilidad"
        title: "Una misma conversación para tu día a día"
        body: "<p>La propuesta reúne estas tres perspectivas para entenderlas con calma y comparar alternativas de demostración. No constituye una oferta ni asesoramiento comercial real.</p>"
        alignment: "center"
        width: "medium"
    - id: "benefits-01"
      component_id: "C04"
      include: "sdc_landing:feature-grid"
      status: "catalog"
      props:
        title: "Todo empieza por entender mejor tu rutina"
        description: "Una visión clara para explorar opciones sin presión comercial."
        item_1_icon: "home"
        item_1_title: "Tu hogar"
        item_1_text: "El consumo de la vivienda como punto de partida."
        item_2_icon: "charging"
        item_2_title: "Tu recarga"
        item_2_text: "La frecuencia y el lugar de recarga en tu día a día."
        item_3_icon: "compare"
        item_3_title: "Tus alternativas"
        item_3_text: "Opciones ilustrativas que puedes comparar con calma."
        columns: 3
        variant: "with-icons"
        theme: "light"
    - id: "comparison-01"
      component_id: "C11"
      include: "sdc_landing:plan-comparison"
      status: "experimental"
