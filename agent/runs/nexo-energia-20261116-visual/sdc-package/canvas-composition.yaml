    - id: "wizard-01"
      component_id: "C12"
      include: "sdc_landing:recommendation-wizard"
      status: "experimental"
      props:
        title: "Encuentra una orientación demostrativa"
        description: "Tres pasos ilustrativos para explorar una alternativa; no es contratación ni recomendación comercial real."
        step_1_id: "home"
        step_1_label: "Tu vivienda"
        step_1_field: "home_type"
        step_1_type: "radio"
