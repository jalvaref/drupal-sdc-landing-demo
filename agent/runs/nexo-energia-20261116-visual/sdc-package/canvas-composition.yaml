        primary_url: "#contacto"
    - id: "editorial-01"
      component_id: "C03"
      include: "sdc_landing:image-text"
      status: "catalog"
      props:
        eyebrow: "Una escena cotidiana"
        title: "La energía de tu hogar también mueve tu día a día"
        description: "Un ejemplo ilustrativo de cómo la vivienda, la rutina y la movilidad pueden contemplarse de forma conjunta."
        image_src: "/themes/custom/sdc_landing/images/nexo-energia-20261116-rutina.jpg"
        image_alt: "Dos personas junto a un coche eléctrico y un cargador doméstico mientras revisan una tableta"
        cta_label: "Volver a mi orientación"
        cta_url: "#orientacion"
        image_position: "left"
        theme: "light"
    - id: "process-01"
      component_id: "C07"
      include: "sdc_landing:steps"
      status: "catalog"
      props:
        title: "Así continúa la conversación"
        description: "Proceso demostrativo y no conectado a sistemas reales."
        step_1_title: "Cuéntanos tu punto de partida"
        step_1_text: "Hablas de tu vivienda y movilidad de forma general."
        step_1_icon: "home"
        step_2_title: "Explora alternativas"
        step_2_text: "Revisas opciones y condiciones ficticias."
        step_2_icon: "compare"
        step_3_title: "Recibe una orientación"
        step_3_text: "Consultas un resultado ilustrativo según tus respuestas."
        step_3_icon: "guidance"
        step_4_title: "Decide el siguiente paso"
        step_4_text: "Solicitas una conversación demostrativa si te interesa."
        step_4_icon: "conversation"
        variant: "numbered"
    - id: "faq-01"
      component_id: "C09"
      include: "sdc_landing:faq-accordion"
      status: "catalog"
      props:
        title: "Preguntas frecuentes"
        items:
          - question: "¿Quién puede utilizar esta propuesta?"
            answer: "<p>Cualquier persona adulta puede recorrer esta demostración. No crea derechos, elegibilidad ni acceso a una oferta real.</p>"
          - question: "¿Los precios y las condiciones son reales?"
            answer: "<p>No. Todos los precios, ventajas y condiciones son ilustrativos y no válidos para publicación ni contratación.</p>"
          - question: "¿Es necesario tener un vehículo eléctrico?"
            answer: "<p>No. También está dirigida a quien está valorando la movilidad eléctrica o solo quiere entender su encaje con el hogar.</p>"
          - question: "¿Qué ocurre después de solicitar información?"
            answer: "<p>En este prototipo no se envía ninguna solicitud. Un flujo real requeriría definición, aprobación y conexión específica.</p>"
          - question: "¿La orientación implica contratación?"
            answer: "<p>No. El resultado es ficticio, demostrativo y no supone una contratación ni una recomendación comercial real.</p>"
          - question: "¿Cómo se utilizarían los datos introducidos?"
            answer: "<p>En esta demostración no se almacenan ni se envían datos. Un flujo real necesitaría aviso de privacidad, finalidad y controles aprobados.</p>"
    - id: "cta-01"
      component_id: "C10"
      include: "sdc_landing:cta-banner"
      status: "catalog"
      props:
        eyebrow: "Siguiente paso"
        title: "Hablemos de tu hogar y tu movilidad"
        description: "Solicita una conversación demostrativa para resolver tus dudas. No hay contratación automática ni conexión a un sistema real."
        primary_label: "Solicitar una conversación"
        primary_url: "#contacto"
        secondary_label: "Volver a la comparativa"
        secondary_url: "#alternativas"
        theme: "dark"
        variant: "standard"

