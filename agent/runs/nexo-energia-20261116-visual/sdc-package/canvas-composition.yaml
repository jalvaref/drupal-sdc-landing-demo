        step_2_option_1: "Ocasional"
        step_2_option_2: "Habitual en casa"
        step_2_option_3: "Variable o aún no lo sé"
        step_3_id: "priority"
        step_3_label: "Tu necesidad principal"
        step_3_field: "priority"
