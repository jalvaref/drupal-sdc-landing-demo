        step_3_option_3: "Flexibilidad y movilidad"
        rule_1_when: "priority=Flexibilidad y movilidad"
        rule_1_plan_id: "flex"
        rule_2_when: "charge_pattern=Ocasional"
        rule_2_plan_id: "base"
        rule_3_when: "home_type=Casa AND charge_pattern=Habitual en casa"
        rule_3_plan_id: "equilibrio"
